name: CI

# Runs on pull requests and on pushes to the long-lived branches. Nothing here
# needs a database: `prisma generate` deliberately does not require DATABASE_URL
# (see packages/db/prisma.config.ts), and no test touches a live connection yet.
# The day one does, it gets a Postgres service container — not a shared instance.
#
# `pull_request` is deliberately unfiltered: every PR is verified regardless of
# the branch it targets.
on:
  push:
    branches: [main, development]
  pull_request:

# A superseded run on the same ref tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node, which needs pnpm on PATH to resolve its store
      # for caching. The version comes from `packageManager` in package.json —
      # not repeated here, so there is one place to bump it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, because it is a dry run and takes a second: it asserts that
      # `@fastehr/db#generate` is still ordered before `@fastehr/web#typecheck`,
      # and that turbo.json still declares the topological `^generate` that
      # carries the edge through any package inserted between the app and db.
      # A regression here surfaces below as a confusing TS2307; catching it by
      # name first is worth the second.
      - name: Guard the generate task graph
        run: pnpm check:graph

      # `--force` bypasses the turbo cache on purpose.
      #
      # This job exists primarily to be the cold build. The `^generate` race the
      # guard above protects is invisible against a warm cache — `src/generated`
      # is already on disk, so the ordering never gets tested — which is exactly
      # why the README calls it a failure that "only bites on a cold build: CI,
      # or a fresh clone". A cache here would hide the one thing CI is best
      # placed to catch.
      #
      # The whole workspace builds cold in under ten seconds, so there is
      # nothing to optimise yet. When that stops being true, the answer is a
      # second cached job for fast feedback, keeping this one cold — not
      # caching this one. Affected-only filtering
      # (`--filter=...[origin/<base>]`) is the same trade and equally premature
      # at five packages.
      #
      # The pnpm store *is* cached, above. That speeds installs without
      # affecting task ordering.
      - name: Verify (cold)
        run: pnpm turbo run lint typecheck test build --force

      # /_smoke is dynamic now that it calls a tRPC procedure, so `next build`
      # no longer renders it and a broken seam would not fail the step above.
      # This serves the build and asserts the route reports every seam healthy —
      # including that prefetched data reaches the client, which only shows up
      # at runtime.
      - name: Smoke the built app
        run: pnpm smoke

  # Separate job, and deliberately so: the job above proves the workspace builds
  # and tests with no environment at all, which is what a fresh clone gets.
  # Adding a database to it would quietly retire that guarantee.
  integration:
    name: db integration (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastehr_test
        ports:
          - 5432:5432
        # Without this the steps below race the container's first boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Applies the committed migrations with `migrate deploy` before running,
      # so a migration that is committed but broken fails here rather than at a
      # deployment.
      # Serialized: the db and web suites share one database and truncate
      # tables between cases, so running them in parallel is a race — the db
      # suite's TRUNCATE ... CASCADE deletes sessions the auth suite is using.
      - name: Integration tests
        run: pnpm turbo run test:integration --concurrency=1
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastehr_test
